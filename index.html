<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมตอบคำถามฟิสิกส์ - Physics Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            color: #333;
        }
        .btn-push {
            transition: all 0.1s;
        }
        .btn-push:active {
            transform: translateY(4px);
        }
        .resistor-band {
            display: inline-block;
            width: 30px;
            height: 80px;
            margin: 0 2px;
            border: 1px solid #333;
        }
        /* Custom Colors for Resistors */
        .bg-r-black { background-color: black; }
        .bg-r-brown { background-color: #8B4513; }
        .bg-r-red { background-color: red; }
        .bg-r-orange { background-color: orange; }
        .bg-r-yellow { background-color: yellow; }
        .bg-r-green { background-color: green; }
        .bg-r-blue { background-color: blue; }
        .bg-r-violet { background-color: violet; }
        .bg-r-grey { background-color: grey; }
        .bg-r-white { background-color: white; border: 1px solid #ddd;}
        .bg-r-gold { background: linear-gradient(to bottom, #FFD700, #FDB931); }
        .bg-r-silver { background: linear-gradient(to bottom, #C0C0C0, #E0E0E0); }

        /* Animation for Special Rule */
        @keyframes popIn {
            0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
            100% { transform: scale(1) rotate(-1deg); opacity: 1; }
        }
        .rule-pop {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <!-- Setup Screen (Overlay) -->
    <div id="setupScreen" class="fixed inset-0 bg-gray-900 z-50 flex flex-col items-center justify-center p-4">
        <h1 class="text-4xl md:text-6xl font-bold mb-8 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-red-500">Physics Battle</h1>
        <div class="bg-white p-8 rounded-xl w-full max-w-lg text-gray-800">
            <h2 class="text-2xl font-bold mb-4 text-center">ตั้งชื่อทีม</h2>
            <div class="space-y-4">
                <input type="text" id="team1NameInput" value="ทีม A" class="w-full p-3 border rounded text-lg focus:ring-2 ring-blue-500" placeholder="ชื่อทีม 1">
                <input type="text" id="team2NameInput" value="ทีม B" class="w-full p-3 border rounded text-lg focus:ring-2 ring-red-500" placeholder="ชื่อทีม 2">
                <input type="text" id="team3NameInput" value="ทีม C" class="w-full p-3 border rounded text-lg focus:ring-2 ring-green-500" placeholder="ชื่อทีม 3">
            </div>
            <button onclick="startGame()" class="mt-8 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-lg text-xl shadow-lg transform hover:scale-105 transition">
                เริ่มการแข่งขัน 🚀
            </button>
        </div>
    </div>

    <!-- Main Game Area -->
    <div class="w-full max-w-7xl mx-auto hidden" id="gameArea">
        
        <!-- Header & Timer -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-3xl font-bold text-white drop-shadow-md">Physics Battle Phase</h1>
                <p class="text-yellow-200">โจทย์ฟิสิกส์ประลองปัญญา</p>
            </div>
            
            <div class="bg-gray-900 px-6 py-3 rounded-xl border-2 border-yellow-400 flex items-center gap-4 shadow-xl">
                <i class="fas fa-stopwatch text-3xl text-yellow-400"></i>
                <div id="timerDisplay" class="text-5xl font-mono font-bold text-white">05:00</div>
                <div class="flex flex-col gap-1">
                    <button onclick="toggleTimer()" id="timerBtn" class="bg-green-600 hover:bg-green-500 text-xs px-2 py-1 rounded text-white font-bold uppercase">Start</button>
                    <button onclick="resetTimer()" class="bg-red-600 hover:bg-red-500 text-xs px-2 py-1 rounded text-white font-bold uppercase">Reset</button>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Question Area (Left - 2 Cols) -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Topic Selector & Generator -->
                <div class="card p-6">
                    <div class="flex flex-wrap gap-2 mb-4 justify-center">
                        <select id="topicSelect" class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                            <option value="all">🔀 สุ่มทุกหัวข้อ</option>
                            <option value="work_energy">⚙️ งานและพลังงาน</option>
                            <option value="cons_energy_no_loss">🔋 กฎอนุรักษ์ (ไม่สูญเสีย)</option>
                            <option value="cons_energy_loss">🔥 กฎอนุรักษ์ (สูญเสีย)</option>
                            <option value="resistor_code">🌈 แถบสีตัวต้านทาน</option>
                            <option value="circuit">🔌 วงจร (อนุกรม/ขนาน)</option>
                            <option value="ray_optics">🔦 ทางเดินแสง (เลนส์/กระจก)</option>
                            <option value="temp_conv">🌡️ เปลี่ยนหน่วยอุณหภูมิ</option>
                            <option value="elec_heat">⚡ ไฟฟ้าเป็นความร้อน</option>
                        </select>
                        <button onclick="generateQuestion()" class="btn-push bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-lg shadow-lg flex items-center gap-2">
                            <i class="fas fa-bolt"></i> สุ่มโจทย์ & เริ่ม!
                        </button>
                    </div>

                    <div class="relative min-h-[300px] flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-lg p-8 bg-blue-50">
                        <span id="categoryBadge" class="absolute top-4 left-4 bg-indigo-100 text-indigo-800 text-xs font-medium px-2.5 py-0.5 rounded border border-indigo-400">หัวข้อ</span>
                        
                        <div id="questionContent" class="text-center w-full">
                            
                            <!-- Special Rule Container -->
                            <div id="specialRuleContainer" class="hidden mb-6 p-4 bg-yellow-100 border-2 border-yellow-400 text-yellow-800 rounded-xl shadow-md transform -rotate-1 mx-auto max-w-md rule-pop">
                                <h4 class="font-extrabold text-xl mb-1"><i class="fas fa-exclamation-circle"></i> กติกาพิเศษ!</h4>
                                <p id="specialRuleText" class="text-lg font-bold"></p>
                            </div>

                            <h3 class="text-2xl md:text-3xl font-bold text-gray-800 mb-4 leading-relaxed" id="questionText">
                                กดปุ่ม "สุ่มโจทย์ & เริ่ม!" เพื่อเริ่มเกม
                            </h3>
                            <div id="visualContent" class="my-4 flex justify-center h-24"></div>
                        </div>

                        <!-- Answer Section (Hidden) -->
                        <div id="answerSection" class="hidden mt-8 w-full pt-6 border-t border-gray-300 text-center animate-fade-in">
                            <p class="text-sm text-gray-500 uppercase tracking-wider mb-2">เฉลย / คำตอบ</p>
                            <p class="text-3xl font-bold text-green-600" id="answerText"></p>
                            <p class="text-md text-gray-600 mt-2" id="explanationText"></p>
                        </div>
                    </div>

                    <div class="mt-4 flex justify-center">
                        <button onclick="showAnswer()" id="showAnsBtn" class="hidden bg-yellow-500 hover:bg-yellow-400 text-white font-bold py-3 px-8 rounded-full shadow-lg text-lg">
                            <i class="fas fa-eye"></i> ดูเฉลย
                        </button>
                    </div>
                </div>

            </div>

            <!-- Scoreboard (Right - 1 Col) -->
            <div class="lg:col-span-1 space-y-4">
                <div class="card p-4 bg-gradient-to-b from-gray-50 to-gray-200">
                    <h2 class="text-xl font-bold text-center mb-4 text-gray-700">🏆 คะแนนทีม</h2>
                    
                    <!-- Team 1 -->
                    <div class="bg-white p-4 rounded-lg shadow mb-3 border-l-8 border-blue-500 flex justify-between items-center">
                        <div>
                            <h3 id="team1Name" class="font-bold text-lg text-gray-800">Team A</h3>
                            <div class="text-4xl font-bold text-blue-600" id="score1">0</div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <button onclick="adjustScore(1, 1)" class="w-10 h-10 rounded-full bg-green-100 text-green-600 hover:bg-green-200 font-bold text-xl">+</button>
                            <button onclick="adjustScore(1, -1)" class="w-10 h-10 rounded-full bg-red-100 text-red-600 hover:bg-red-200 font-bold text-xl">-</button>
                        </div>
                    </div>

                    <!-- Team 2 -->
                    <div class="bg-white p-4 rounded-lg shadow mb-3 border-l-8 border-red-500 flex justify-between items-center">
                        <div>
                            <h3 id="team2Name" class="font-bold text-lg text-gray-800">Team B</h3>
                            <div class="text-4xl font-bold text-red-600" id="score2">0</div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <button onclick="adjustScore(2, 1)" class="w-10 h-10 rounded-full bg-green-100 text-green-600 hover:bg-green-200 font-bold text-xl">+</button>
                            <button onclick="adjustScore(2, -1)" class="w-10 h-10 rounded-full bg-red-100 text-red-600 hover:bg-red-200 font-bold text-xl">-</button>
                        </div>
                    </div>

                    <!-- Team 3 -->
                    <div class="bg-white p-4 rounded-lg shadow mb-3 border-l-8 border-green-500 flex justify-between items-center">
                        <div>
                            <h3 id="team3Name" class="font-bold text-lg text-gray-800">Team C</h3>
                            <div class="text-4xl font-bold text-green-600" id="score3">0</div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <button onclick="adjustScore(3, 1)" class="w-10 h-10 rounded-full bg-green-100 text-green-600 hover:bg-green-200 font-bold text-xl">+</button>
                            <button onclick="adjustScore(3, -1)" class="w-10 h-10 rounded-full bg-red-100 text-red-600 hover:bg-red-200 font-bold text-xl">-</button>
                        </div>
                    </div>

                    <button onclick="resetScores()" class="w-full mt-4 text-gray-400 text-sm hover:text-red-500">Reset All Scores</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let scores = { 1: 0, 2: 0, 3: 0 };
        let timerInterval;
        let timeLeft = 300; // 5 minutes
        let isRunning = false;
        
        // --- SETUP ---
        function startGame() {
            document.getElementById('team1Name').textContent = document.getElementById('team1NameInput').value || "Team A";
            document.getElementById('team2Name').textContent = document.getElementById('team2NameInput').value || "Team B";
            document.getElementById('team3Name').textContent = document.getElementById('team3NameInput').value || "Team C";
            
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('gameArea').classList.remove('hidden');
        }

        // --- SCORE SYSTEM ---
        function adjustScore(team, delta) {
            scores[team] += delta;
            if (scores[team] < 0) scores[team] = 0;
            document.getElementById(`score${team}`).textContent = scores[team];
        }

        function resetScores() {
            if(confirm("ต้องการรีเซ็ตคะแนนทั้งหมดหรือไม่?")) {
                scores = { 1: 0, 2: 0, 3: 0 };
                [1,2,3].forEach(t => document.getElementById(`score${t}`).textContent = 0);
            }
        }

        // --- TIMER SYSTEM ---
        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').textContent = `${m}:${s}`;
            
            if (timeLeft <= 30) {
                document.getElementById('timerDisplay').classList.add('text-red-500');
            } else {
                document.getElementById('timerDisplay').classList.remove('text-red-500');
            }
        }

        function toggleTimer() {
            const btn = document.getElementById('timerBtn');
            if (isRunning) {
                clearInterval(timerInterval);
                btn.textContent = "Resume";
                btn.classList.replace('bg-yellow-600', 'bg-green-600');
                btn.classList.replace('hover:bg-yellow-500', 'hover:bg-green-500');
                isRunning = false;
            } else {
                if (timeLeft <= 0) timeLeft = 300;
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        alert("หมดเวลา! (Time's Up)");
                    }
                }, 1000);
                btn.textContent = "Pause";
                btn.classList.replace('bg-green-600', 'bg-yellow-600');
                btn.classList.replace('hover:bg-green-500', 'hover:bg-yellow-500');
                isRunning = true;
            }
        }

        function resetTimer(customTime = 300) {
            clearInterval(timerInterval);
            isRunning = false;
            timeLeft = customTime;
            updateTimerDisplay();
            const btn = document.getElementById('timerBtn');
            btn.textContent = "Start";
            btn.classList.replace('bg-yellow-600', 'bg-green-600');
        }

        // --- QUESTION GENERATOR ENGINE ---
        
        const resistorColors = [
            { name: 'Black', val: 0, code: 'bg-r-black', text: 'white' },
            { name: 'Brown', val: 1, code: 'bg-r-brown', text: 'white' },
            { name: 'Red', val: 2, code: 'bg-r-red', text: 'white' },
            { name: 'Orange', val: 3, code: 'bg-r-orange', text: 'black' },
            { name: 'Yellow', val: 4, code: 'bg-r-yellow', text: 'black' },
            { name: 'Green', val: 5, code: 'bg-r-green', text: 'white' },
            { name: 'Blue', val: 6, code: 'bg-r-blue', text: 'white' },
            { name: 'Violet', val: 7, code: 'bg-r-violet', text: 'white' },
            { name: 'Grey', val: 8, code: 'bg-r-grey', text: 'black' },
            { name: 'White', val: 9, code: 'bg-r-white', text: 'black' }
        ];

        const tolerances = [
            { name: 'Gold', val: 5, code: 'bg-r-gold' },
            { name: 'Silver', val: 10, code: 'bg-r-silver' }
        ];

        // Helper: Random Integer
        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

        // Generators per Topic
        const generators = {
            work_energy: () => {
                const types = [
                    () => {
                        const F = rand(10, 100);
                        const s = rand(2, 20);
                        return {
                            q: `ออกแรง ${F} นิวตัน ผลักวัตถุไปตามพื้นราบได้ระยะทาง ${s} เมตร จงหางานที่ทำ (Work)`,
                            a: `${F * s} จูล (J)`,
                            exp: `สูตร W = F × s = ${F} × ${s}`
                        };
                    },
                    () => {
                        const m = rand(2, 20);
                        const v = rand(2, 10) * 2; // keep numbers nice
                        return {
                            q: `วัตถุมวล ${m} kg กำลังเคลื่อนที่ด้วยความเร็ว ${v} m/s จงหาพลังงานจลน์ (Ek)`,
                            a: `${0.5 * m * v * v} จูล (J)`,
                            exp: `สูตร Ek = ½mv² = ½ × ${m} × ${v}²`
                        };
                    },
                    () => {
                        const m = rand(1, 10);
                        const h = rand(5, 50);
                        return {
                            q: `ก้อนหินมวล ${m} kg อยู่บนหน้าผาสูง ${h} เมตร จากพื้นดิน จงหาพลังงานศักย์โน้มถ่วง (Ep) (ให้ g=10)`,
                            a: `${m * 10 * h} จูล (J)`,
                            exp: `สูตร Ep = mgh = ${m} × 10 × ${h}`
                        };
                    }
                ];
                return pick(types)();
            },
            
            cons_energy_no_loss: () => {
                const m = rand(1, 5);
                const h = rand(5, 20);
                const g = 10;
                // mgh = 1/2mv^2 => v = sqrt(2gh)
                return {
                    q: `วัตถุมวล ${m} kg ตกจากตึกสูง ${h} เมตร ลงสู่พื้นดินโดยไม่มีแรงต้านอากาศ ความเร็วขณะกระทบพื้นเป็นเท่าใด? (g=10)`,
                    a: `${Math.sqrt(2*g*h).toFixed(2)} m/s`,
                    exp: `กฎอนุรักษ์พลังงาน: Ep (บน) = Ek (ล่าง) <br> mgh = ½mv² <br> v = √(2gh) = √(2×10×${h})`
                };
            },

            cons_energy_loss: () => {
                const m = rand(2, 10);
                const h = 10;
                const f = rand(1, 5);
                const s = 10; // distance down
                const w_f = f * s;
                const ep = m * 10 * h;
                const ek = ep - w_f;
                return {
                    q: `วัตถุมวล ${m} kg ไถลลงจากพื้นเอียงสูง ${h} เมตร มีแรงเสียดทานเฉลี่ย ${f} N ตลอดความยาวพื้นเอียง ${s} เมตร พลังงานจลน์ที่ปลายพื้นเอียงเป็นเท่าใด?`,
                    a: `${ek} จูล (J)`,
                    exp: `E_start - W_loss = E_final <br> mgh - (f×s) = Ek <br> (${m}×10×${h}) - (${f}×${s}) = ${ep} - ${w_f}`
                };
            },

            resistor_code: () => {
                const is5Band = Math.random() > 0.5;
                let c1 = pick(resistorColors.slice(1)); // First digit can't be black
                let c2 = pick(resistorColors);
                let c3 = is5Band ? pick(resistorColors) : null;
                let mul = pick(resistorColors.slice(0, 7)); // Multiplier up to Mega
                let tol = pick(tolerances);

                let val = 0;
                let bandsHtml = '';

                if (is5Band) {
                    val = parseInt(`${c1.val}${c2.val}${c3.val}`) * Math.pow(10, mul.val);
                    bandsHtml = `
                        <div class="resistor-band ${c1.code}"></div>
                        <div class="resistor-band ${c2.code}"></div>
                        <div class="resistor-band ${c3.code}"></div>
                        <div class="resistor-band ${mul.code}"></div>
                        <div class="resistor-band ${tol.code}" style="margin-left: 10px;"></div>
                    `;
                } else {
                    val = parseInt(`${c1.val}${c2.val}`) * Math.pow(10, mul.val);
                    bandsHtml = `
                        <div class="resistor-band ${c1.code}"></div>
                        <div class="resistor-band ${c2.code}"></div>
                        <div class="resistor-band ${mul.code}"></div>
                        <div class="resistor-band ${tol.code}" style="margin-left: 10px;"></div>
                    `;
                }

                // Format value nicely (k, M)
                let displayVal = val;
                let unit = "Ω";
                if (val >= 1000000) { displayVal = val/1000000; unit = "MΩ"; }
                else if (val >= 1000) { displayVal = val/1000; unit = "kΩ"; }

                return {
                    q: `จงอ่านค่าความต้านทานจากแถบสีต่อไปนี้ (${is5Band ? '5' : '4'} แถบ)`,
                    visual: bandsHtml,
                    a: `${displayVal} ${unit} ±${tol.val}%`,
                    exp: `แถบสี: ${c1.name}, ${c2.name} ${is5Band ? ', '+c3.name : ''}, x10^${mul.val}, Tol ${tol.val}%`
                };
            },

            circuit: () => {
                const type = Math.random() > 0.5 ? 'Series' : 'Parallel';
                const r1 = rand(1, 10) * 10;
                const r2 = rand(1, 10) * 10;

                if (type === 'Series') {
                    return {
                        q: `ตัวต้านทาน R1 = ${r1}Ω และ R2 = ${r2}Ω ต่อกันแบบ **อนุกรม** ความต้านทานรวมเป็นเท่าใด?`,
                        a: `${r1 + r2} Ω`,
                        exp: `อนุกรม: R_total = R1 + R2`
                    };
                } else {
                    // Make parallel nice numbers if possible, or just exact formula
                    // Let's use easy numbers: if R1=R2, R/2. Or R1=30, R2=60 -> 20.
                    // For random, keep it simple formula display
                    const num = r1 * r2;
                    const den = r1 + r2;
                    const ans = (num/den).toFixed(2);
                    return {
                        q: `ตัวต้านทาน R1 = ${r1}Ω และ R2 = ${r2}Ω ต่อกันแบบ **ขนาน** ความต้านทานรวมเป็นเท่าใด?`,
                        a: `${ans} Ω`,
                        exp: `ขนาน: (R1 × R2) / (R1 + R2) = ${num} / ${den}`
                    };
                }
            },

            ray_optics: () => {
                const scenarios = [
                    { q: "วัตถุวางอยู่ระหว่างจุดโฟกัส (F) กับเลนส์นูน", a: "ภาพเสมือน, หัวตั้ง, ขนาดขยาย", exp: "เลนส์นูน ระยะวัตถุ < f จะได้ภาพเสมือนขนาดใหญ่ (เช่น แว่นขยาย)" },
                    { q: "วัตถุวางอยู่ที่จุดศูนย์กลางความโค้ง (C) หน้ากระจกเว้า", a: "ภาพจริง, หัวกลับ, ขนาดเท่าวัตถุ", exp: "กระจกเว้า วางที่ C ภาพเกิดที่ C ขนาดเท่าเดิม" },
                    { q: "วัตถุวางหน้ากระจกนูน (ระยะใดก็ได้)", a: "ภาพเสมือน, หัวตั้ง, ขนาดเล็กกว่าวัตถุ", exp: "กระจกนูนและเลนส์เว้า ให้ภาพเสมือนหัวตั้งขนาดเล็กเสมอ" },
                    { q: "วัตถุวางไกลมาก (ระยะอนันต์) หน้าเลนส์นูน", a: "ภาพจริง, เป็นจุด, อยู่ที่จุดโฟกัส", exp: "แสงขนานรวมกันที่จุดโฟกัสหลังเลนส์" },
                    { q: "วัตถุวางระหว่าง F และ 2F หน้าเลนส์นูน", a: "ภาพจริง, หัวกลับ, ขนาดขยาย", exp: "เกิดภาพหลังเลนส์ ไกลกว่า 2F" }
                ];
                return pick(scenarios);
            },

            temp_conv: () => {
                const c = rand(20, 100);
                const askF = Math.random() > 0.5;
                
                if (askF) {
                    const f = (c * 9/5) + 32;
                    return {
                        q: `เปลี่ยนอุณหภูมิ ${c}°C เป็นองศาฟาเรนไฮต์ (°F)`,
                        a: `${f.toFixed(1)} °F`,
                        exp: `F = (C × 9/5) + 32`
                    };
                } else {
                    const k = c + 273;
                    return {
                        q: `เปลี่ยนอุณหภูมิ ${c}°C เป็นเคลวิน (K)`,
                        a: `${k} K`,
                        exp: `K = C + 273`
                    };
                }
            },

            elec_heat: () => {
                // Pt = mc(T2-T1)
                // Realistic Kettle Scenario
                
                // Mass: 0.5 - 1.5 kg (Step 0.1)
                const m_kg = rand(5, 15) / 10; 
                
                // Power: 1500 - 2500 W (Typical electric kettle)
                const P = rand(15, 25) * 100; 
                
                // Limit time so water doesn't boil over (assuming start at ~20°C, max rise ~80°C)
                // t_max = (m * c * 80) / P
                const c = 4200;
                const max_time = Math.floor((m_kg * c * 80) / P);
                
                // Random time between 20s and max_time, step 5s or 10s
                // Ensure min time is at least 20s
                const safe_max_step = Math.max(2, Math.floor(max_time/10));
                const t_sec = rand(2, safe_max_step) * 10;
                
                // Q = Pt
                const Q = P * t_sec;
                // dt = Q / mc
                const dT = Q / (m_kg * c);
                
                return {
                    q: `กาต้มน้ำไฟฟ้ากำลัง ${P} วัตต์ ต้มน้ำมวล ${m_kg} kg เป็นเวลา ${t_sec} วินาที อุณหภูมิน้ำจะเพิ่มขึ้นกี่องศาเซลเซียส? <br><span class="text-sm text-gray-500">(กำหนดให้ c น้ำ = 4200 J/kg·K และไม่มีการสูญเสียความร้อน)</span>`,
                    a: `${dT.toFixed(1)} °C`,
                    exp: `จากสูตร Pt = mcΔT <br> แทนค่า: ${P}×${t_sec} = ${m_kg}×4200×ΔT <br> พลังงานไฟฟ้าที่ใช้ = ${Q.toLocaleString()} J <br> ΔT = ${Q} / ${(m_kg*c)} = ${dT.toFixed(2)} °C`
                };
            }
        };

        // --- FUNNY RULES (CHALLENGE MODE) ---
        const specialRules = [
            "คนตอบต้องยืนขาเดียวจนกว่าจะตอบเสร็จ 🦩",
          
            "ห้ามใช้มือขวาเขียนคำตอบ (ใช้มือซ้ายเท่านั้น) ✍️",
           
            "Speed Run! ข้อนี้มีเวลาแค่ 1 นาทีเท่านั้น ⏱️",
        
            "หัวหน้าทีมต้องเต้นไก่ย่าง 1 รอบก่อนตอบ 🐔",
            
            
        ];

        // --- MAIN LOGIC ---

        function generateQuestion() {
            // UI Reset
            document.getElementById('answerSection').classList.add('hidden');
            document.getElementById('showAnsBtn').classList.remove('hidden');
            document.getElementById('visualContent').innerHTML = '';
            
            // Topic Selection
            let topic = document.getElementById('topicSelect').value;
            const keys = Object.keys(generators);
            
            if (topic === 'all') {
                topic = pick(keys);
            }

            // Map Topic ID to Thai Name
            const names = {
                work_energy: "งานและพลังงาน",
                cons_energy_no_loss: "อนุรักษ์พลังงาน (ไม่สูญเสีย)",
                cons_energy_loss: "อนุรักษ์พลังงาน (สูญเสีย)",
                resistor_code: "แถบสีตัวต้านทาน",
                circuit: "วงจรไฟฟ้า",
                ray_optics: "ทางเดินแสง",
                temp_conv: "เปลี่ยนหน่วยอุณหภูมิ",
                elec_heat: "ไฟฟ้าและความร้อน"
            };
            document.getElementById('categoryBadge').textContent = names[topic];

            // Generate Question
            const data = generators[topic]();
            document.getElementById('questionText').innerHTML = data.q;
            if(data.visual) {
                document.getElementById('visualContent').innerHTML = data.visual;
            }
            
            // Store Answer
            document.getElementById('answerText').innerHTML = data.a;
            document.getElementById('explanationText').innerHTML = data.exp;

            // --- SPECIAL RULE LOGIC ---
            const ruleContainer = document.getElementById('specialRuleContainer');
            const ruleText = document.getElementById('specialRuleText');
            
            // 60% chance of special rule
            if (Math.random() > 0.4) {
                const rule = pick(specialRules);
                ruleText.textContent = rule;
                ruleContainer.classList.remove('hidden');
                
                // Special Timer Logic for "Speed Run" rule
                if(rule.includes("1 นาที")) {
                    resetTimer(60); // Set to 60s
                } else {
                    resetTimer(300); // Normal 5 mins
                }
            } else {
                ruleContainer.classList.add('hidden');
                resetTimer(300); // Normal 5 mins
            }

            // --- AUTO START TIMER ---
            toggleTimer(); // This starts the timer because resetTimer() set isRunning to false
        }

        function showAnswer() {
            document.getElementById('answerSection').classList.remove('hidden');
            document.getElementById('showAnsBtn').classList.add('hidden');
        }
    </script>
</body>
</html>
