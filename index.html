<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Converter: Neon Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #050510;
            color: #ffffff;
            overflow-x: hidden;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        .neon-bg {
            background: radial-gradient(circle at center, #101020 0%, #050510 100%);
        }

        .neon-box {
            border: 2px solid #00f3ff;
            box-shadow: 0 0 15px #00f3ff, inset 0 0 15px #00f3ff;
            background: rgba(0, 243, 255, 0.05);
            border-radius: 1rem;
        }

        .neon-text-cyan {
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
        }

        .neon-text-pink {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
        }

        .neon-text-green {
            color: #00ff66;
            text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66;
        }

        .neon-btn-cyan {
            background: transparent;
            color: #00f3ff;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 10px #00f3ff, inset 0 0 5px #00f3ff;
            transition: all 0.2s ease-in-out;
        }
        .neon-btn-cyan:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 25px #00f3ff, inset 0 0 10px #00f3ff;
        }

        .neon-btn-danger {
            background: transparent;
            color: #ff0055;
            border: 2px solid #ff0055;
            box-shadow: 0 0 10px #ff0055, inset 0 0 5px #ff0055;
            transition: all 0.2s ease-in-out;
        }
        .neon-btn-danger:hover {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 25px #ff0055, inset 0 0 10px #ff0055;
        }

        .input-neon {
            background: rgba(0,0,0,0.5);
            border: 2px solid #00f3ff;
            color: #fff;
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.3);
        }
        .input-neon:focus {
            outline: none;
            border-color: #00ff66;
            box-shadow: 0 0 15px #00ff66, inset 0 0 10px #00ff66;
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .flash-green {
            animation: flashGreen 0.5s ease-out;
        }
        @keyframes flashGreen {
            0% { box-shadow: 0 0 50px #00ff66, inset 0 0 50px #00ff66; }
            100% { box-shadow: 0 0 15px #00f3ff, inset 0 0 15px #00f3ff; }
        }
    </style>
</head>
<body class="neon-bg min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-2xl relative">
        
        <!-- Start Screen -->
        <div id="screen-start" class="text-center neon-box p-10 flex flex-col items-center">
            <h1 class="text-4xl md:text-6xl font-orbitron font-bold neon-text-cyan mb-4 uppercase">Thermo<br>Cracker</h1>
            <p class="text-lg md:text-xl text-gray-300 mb-8 font-light">
                ท้าทายสมองกับเกมเปลี่ยนหน่วยอุณหภูมิ (C, F, R, K)<br>
                โหมดจับเวลา 5 นาที ทำได้กี่ข้อ?<br>
                <span class="text-sm text-pink-400 mt-2 block">*ใช้ 273 สำหรับหน่วย Kelvin (ไม่ใช่ 273.15)</span>
            </p>
            <button onclick="startGame()" class="neon-btn-cyan font-orbitron text-xl px-10 py-4 rounded-full font-bold uppercase tracking-wider">
                Start Game
            </button>
        </div>

        <!-- Game Screen -->
        <div id="screen-game" class="hidden neon-box p-6 md:p-10 flex flex-col items-center">
            <!-- Header (Progress & Score) -->
            <div class="w-full flex justify-between items-center mb-4 font-orbitron">
                <div class="text-lg text-gray-300">Question: <span id="ui-progress" class="neon-text-cyan font-bold">1</span></div>
                <div class="text-lg text-gray-300">Score: <span id="ui-score" class="neon-text-green font-bold">0</span></div>
            </div>

            <!-- Timer -->
            <div class="w-full bg-gray-900 rounded-full h-4 mb-2 shadow-[0_0_5px_rgba(255,255,255,0.2)] overflow-hidden">
                <div id="ui-timer-bar" class="h-full rounded-full transition-all duration-1000 ease-linear" style="width: 100%; background: #00ff66; box-shadow: 0 0 10px #00ff66;"></div>
            </div>
            <div class="w-full text-right font-orbitron text-sm mb-6"><span id="ui-timer-text" class="text-green-400">300</span>s left</div>

            <!-- Question Area -->
            <div class="text-center w-full mb-8" id="question-container">
                <h2 class="text-2xl text-gray-400 mb-2 font-light">แปลงค่าอุณหภูมิต่อไปนี้</h2>
                <div class="flex items-center justify-center gap-4 text-3xl md:text-5xl font-orbitron font-bold mt-4">
                    <div id="ui-from-value" class="neon-text-pink">--</div>
                    <div class="text-gray-500 text-2xl md:text-4xl">➔</div>
                    <div id="ui-to-unit" class="neon-text-cyan">--</div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="w-full flex flex-col items-center mb-6">
                <input type="number" id="answer-input" step="any" placeholder="กรอกคำตอบที่นี่..." 
                       class="input-neon w-full max-w-xs text-center text-2xl md:text-3xl py-3 rounded-lg font-orbitron mb-4 transition-all"
                       onkeydown="if(event.key === 'Enter') checkAnswer()">
                
                <div id="feedback-msg" class="h-6 text-lg font-bold tracking-wider mb-4 opacity-0 transition-opacity">
                    Feedback
                </div>

                <div class="w-full max-w-xs">
                    <button onclick="checkAnswer()" class="neon-btn-cyan w-full font-orbitron text-lg py-3 rounded-lg font-bold">
                        SUBMIT
                    </button>
                </div>
            </div>
        </div>

        <!-- End Screen -->
        <div id="screen-end" class="hidden text-center neon-box p-10 flex flex-col items-center">
            <h1 class="text-4xl md:text-5xl font-orbitron font-bold neon-text-cyan mb-2 uppercase">Time's Up!</h1>
            <h2 class="text-2xl text-gray-300 mb-8">สรุปผลคะแนนของคุณ</h2>
            
            <div class="text-6xl md:text-8xl font-orbitron font-bold neon-text-green mb-8">
                <span id="ui-final-score">0</span><span class="text-4xl text-gray-500"> ข้อ</span>
            </div>
            
            <p id="ui-remark" class="text-xl text-gray-300 mb-8 font-light"></p>

            <button onclick="resetGame()" class="neon-btn-cyan font-orbitron text-xl px-10 py-4 rounded-full font-bold uppercase tracking-wider">
                Play Again
            </button>
        </div>

    </div>

    <script>
        const GLOBAL_TIME_LIMIT = 300; // 5 นาที (300 วินาที)
        
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let globalTimeLeft = 0;
        let globalTimerInterval;

        const UNITS_INFO = {
            'C': '°C',
            'F': '°F',
            'R': '°R',
            'K': 'K'
        };

        // DOM Elements
        const screenStart = document.getElementById('screen-start');
        const screenGame = document.getElementById('screen-game');
        const screenEnd = document.getElementById('screen-end');
        
        const uiProgress = document.getElementById('ui-progress');
        const uiScore = document.getElementById('ui-score');
        const uiTimerBar = document.getElementById('ui-timer-bar');
        const uiTimerText = document.getElementById('ui-timer-text');
        
        const uiFromValue = document.getElementById('ui-from-value');
        const uiToUnit = document.getElementById('ui-to-unit');
        const answerInput = document.getElementById('answer-input');
        const feedbackMsg = document.getElementById('feedback-msg');
        const questionContainer = document.getElementById('question-container');

        function generateQuestions() {
            let level1 = [];
            let level2 = [];
            let level3 = [];
            
            // 1. ระดับง่าย: ตัวเลขไม่ติดลบ ค่าน้อยๆ (x = 0 ถึง 15) 60 ข้อ
            for (let i = 0; i < 60; i++) {
                let x = Math.floor(Math.random() * 16); // 0 ถึง 15 (รับประกันว่าไม่ติดลบ)
                let values = {
                    'C': 5 * x,
                    'F': 9 * x + 32,
                    'R': 4 * x,
                    'K': 5 * x + 273
                };
                
                let units = ['C', 'F', 'R', 'K'].sort(() => Math.random() - 0.5);
                let fromU = units[0];
                let toU = units[1];
                
                level1.push({
                    fromUnit: fromU,
                    toUnit: toU,
                    fromVal: values[fromU],
                    toVal: values[toU]
                });
            }

            // 2. ระดับปานกลาง: ตัวเลขไม่ติดลบ ค่ามากขึ้น (x = 16 ถึง 60) 60 ข้อ
            for (let i = 0; i < 60; i++) {
                let x = Math.floor(Math.random() * 45) + 16; // 16 ถึง 60
                let values = {
                    'C': 5 * x,
                    'F': 9 * x + 32,
                    'R': 4 * x,
                    'K': 5 * x + 273
                };
                
                let units = ['C', 'F', 'R', 'K'].sort(() => Math.random() - 0.5);
                let fromU = units[0];
                let toU = units[1];
                
                level2.push({
                    fromUnit: fromU,
                    toUnit: toU,
                    fromVal: values[fromU],
                    toVal: values[toU]
                });
            }

            // 3. ระดับยาก: คำตอบเป็นทศนิยม .25, .5, .75 (ตัวเลขไม่ติดลบ) 80 ข้อ
            for (let i = 0; i < 80; i++) {
                let r;
                do {
                    r = Math.floor(Math.random() * 100) + 1; // 1 ถึง 100 (รับประกันว่าไม่ติดลบ)
                } while (r % 4 === 0);

                let values = {
                    'R': r,
                    'C': r * 1.25,                  
                    'F': (r * 2.25) + 32            
                };

                let hardTargets = ['C', 'F']; 
                let toU = hardTargets[Math.floor(Math.random() * hardTargets.length)];
                
                level3.push({
                    fromUnit: 'R',
                    toUnit: toU,
                    fromVal: values['R'],
                    toVal: values[toU]
                });
            }

            // สลับโจทย์ภายในแต่ละระดับ เพื่อไม่ให้ซ้ำซาก
            level1.sort(() => Math.random() - 0.5);
            level2.sort(() => Math.random() - 0.5);
            level3.sort(() => Math.random() - 0.5);

            // นำมาต่อกันให้เรียงลำดับภาพรวมจาก ระดับง่าย -> ปานกลาง -> ยาก
            return [...level1, ...level2, ...level3];
        }

        function startGame() {
            questions = generateQuestions();
            currentQuestionIndex = 0;
            score = 0;
            
            screenStart.classList.add('hidden');
            screenGame.classList.remove('hidden');
            
            startGlobalTimer();
            loadQuestion();
        }

        function loadQuestion() {
            let q = questions[currentQuestionIndex];
            
            uiProgress.innerText = `${currentQuestionIndex + 1}`;
            uiScore.innerText = score;
            
            uiFromValue.innerText = `${q.fromVal} ${UNITS_INFO[q.fromUnit]}`;
            uiToUnit.innerText = `? ${UNITS_INFO[q.toUnit]}`;
            
            answerInput.value = '';
            answerInput.disabled = false;
            answerInput.focus();
            
            feedbackMsg.style.opacity = '0';
        }

        function startGlobalTimer() {
            clearInterval(globalTimerInterval);
            globalTimeLeft = GLOBAL_TIME_LIMIT;
            updateTimerUI();
            
            globalTimerInterval = setInterval(() => {
                globalTimeLeft--;
                updateTimerUI();
                
                if (globalTimeLeft <= 0) {
                    clearInterval(globalTimerInterval);
                    endGame();
                }
            }, 1000);
        }

        function updateTimerUI() {
            uiTimerText.innerText = globalTimeLeft;
            let percentage = (globalTimeLeft / GLOBAL_TIME_LIMIT) * 100;
            uiTimerBar.style.width = `${percentage}%`;

            if (percentage > 50) {
                uiTimerBar.style.background = '#00ff66';
                uiTimerBar.style.boxShadow = '0 0 10px #00ff66';
                uiTimerText.className = 'text-green-400';
            } else if (percentage > 20) {
                uiTimerBar.style.background = '#ffea00';
                uiTimerBar.style.boxShadow = '0 0 10px #ffea00';
                uiTimerText.className = 'text-yellow-400';
            } else {
                uiTimerBar.style.background = '#ff0055';
                uiTimerBar.style.boxShadow = '0 0 10px #ff0055';
                uiTimerText.className = 'text-red-500 animate-pulse';
            }
        }

        function checkAnswer() {
            if (answerInput.disabled || answerInput.value === '') return;
            
            let userAns = parseFloat(answerInput.value);
            let correctAns = questions[currentQuestionIndex].toVal;
            
            if (Math.abs(userAns - correctAns) < 0.01) {
                // Correct!
                score++;
                uiScore.innerText = score;
                showFeedback('ถูกต้อง!', 'success');
                
                questionContainer.classList.add('flash-green');
                setTimeout(() => questionContainer.classList.remove('flash-green'), 500);
                
                answerInput.disabled = true;
                setTimeout(() => {
                    nextQuestion();
                }, 700); // เปลี่ยนข้อไวขึ้นในโหมดจับเวลารวม
            } else {
                // Wrong!
                showFeedback('ผิด! ลองใหม่', 'danger');
                
                questionContainer.classList.add('shake');
                setTimeout(() => questionContainer.classList.remove('shake'), 500);
                
                answerInput.value = '';
                answerInput.focus();
            }
        }

        function showFeedback(text, type) {
            feedbackMsg.innerText = text;
            feedbackMsg.style.opacity = '1';
            
            if (type === 'success') {
                feedbackMsg.className = 'h-6 text-lg font-bold tracking-wider mb-4 transition-opacity neon-text-green';
            } else if (type === 'danger') {
                feedbackMsg.className = 'h-6 text-lg font-bold tracking-wider mb-4 transition-opacity neon-text-pink';
            } else {
                feedbackMsg.className = 'h-6 text-lg font-bold tracking-wider mb-4 transition-opacity neon-text-cyan';
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            clearInterval(globalTimerInterval);
            screenGame.classList.add('hidden');
            screenEnd.classList.remove('hidden');
            
            document.getElementById('ui-final-score').innerText = score;
            
            let remark = document.getElementById('ui-remark');
            if (score >= 50) {
                remark.innerHTML = "Godlike! คุณคือปรมาจารย์ด้านอุณหพลศาสตร์ตัวจริง <br><span class='neon-text-cyan'>S-RANK</span>";
            } else if (score >= 35) {
                remark.innerHTML = "ยอดเยี่ยมมาก! ความเร็วและความแม่นยำสูงมาก <br><span class='neon-text-green'>A-RANK</span>";
            } else if (score >= 20) {
                remark.innerHTML = "ทำได้ดี! แต่ยังสามารถเร่งความเร็วได้อีก <br><span class='text-yellow-400'>B-RANK</span>";
            } else {
                remark.innerHTML = "ต้องฝึกฝนเพิ่มเติมให้ไวขึ้น ลองใหม่อีกครั้ง! <br><span class='neon-text-pink'>C-RANK</span>";
            }
        }

        function resetGame() {
            screenEnd.classList.add('hidden');
            screenStart.classList.remove('hidden');
        }
    </script>
</body>
</html>
