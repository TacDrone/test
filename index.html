<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ภารกิจพิชิตหน่วยความร้อน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            touch-action: none; /* Prevent scroll while dragging on mobile */
            overflow: hidden;
            user-select: none; /* ป้องกันการคลุมดำข้อความเวลาลาก ซึ่งทำให้ลากค้าง */
            -webkit-user-select: none;
        }
        
        .dropzone {
            transition: all 0.2s ease;
        }
        
        .choice-card {
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }
        .choice-card:active {
            transform: scale(0.95);
        }
        
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes floatUpAnim {
            0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50px) scale(1.5); opacity: 0; }
        }
        .float-up {
            animation: floatUpAnim 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        canvas {
            touch-action: none;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-cyan-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl overflow-hidden flex flex-col relative h-[90vh] max-h-[800px]">
        
        <!-- Header -->
        <div class="bg-indigo-600 text-white p-4 text-center relative z-10 shadow-md">
            <h1 class="text-xl md:text-2xl font-bold tracking-wide">🔥 ภารกิจพิชิตหน่วยความร้อน</h1>
            <p class="text-indigo-200 text-sm mt-1">ทดสอบ Q=mcΔT และ Q=mL</p>
        </div>

        <div class="px-6 py-3 bg-indigo-50 flex justify-between items-center border-b border-indigo-100">
            <div class="font-semibold text-indigo-800">
                ข้อที่ <span id="current-question-num" class="text-lg">1</span> / 100
            </div>
            <div class="font-bold text-rose-600 bg-rose-100 px-4 py-1 rounded-full shadow-inner flex items-center gap-2">
                ⏱️ <span id="time-display" class="font-mono text-lg">01:00</span>
            </div>
            <div class="font-bold text-emerald-600 bg-emerald-100 px-3 py-1 rounded-full shadow-inner">
                คะแนน: <span id="score-display">0</span>
            </div>
        </div>
        
        <!-- Progress Line -->
        <div class="w-full bg-gray-200 h-1.5">
            <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-cyan-400 h-1.5 w-0 transition-all duration-300"></div>
        </div>

        <div id="game-screen" class="flex-1 flex flex-col p-4 md:p-6 overflow-hidden">
            
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6 text-center animate-pop shrink-0" id="question-container">
                <!-- Question Text -->
                <h2 id="question-text" class="text-lg md:text-xl font-medium text-gray-800 leading-relaxed">
                    กำลังโหลดคำถาม...
                </h2>
            </div>

            <!-- Choices Area -->
            <div id="choices-container" class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 place-content-center h-full pb-4 overflow-y-auto">
                <!-- Choices will be injected here -->
            </div>
        </div>

        <div id="end-screen" class="absolute inset-0 bg-white z-50 hidden flex-col items-center justify-center p-6 text-center">
            <div class="text-6xl mb-4">🏆</div>
            <h2 class="text-3xl font-bold text-indigo-800 mb-2">จบภารกิจ!</h2>
            <p class="text-xl text-gray-600 mb-6">คะแนนของคุณคือ</p>
            <div class="text-5xl font-black text-emerald-500 mb-8" id="final-score">0 คะแนน</div>
            <p id="end-message" class="text-lg text-gray-700 mb-8 max-w-md"></p>
            <button onclick="location.reload()" class="bg-gradient-to-r from-cyan-500 to-indigo-500 text-white font-bold py-3 px-10 rounded-full shadow-xl transform transition hover:scale-105 active:scale-95">
                เล่นอีกครั้ง
            </button>
        </div>
    </div>

    <script>
        // State variables
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        
        // Audio Synth
        let synth;
        let tickSynth;
        let audioInitialized = false;

        function initAudio() {
            if (!audioInitialized) {
                synth = new Tone.Synth().toDestination();
                
                // สร้างเสียงสำหรับนาฬิกาจับเวลา
                tickSynth = new Tone.Synth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.005, decay: 0.05, sustain: 0, release: 0.01 }
                }).toDestination();
                tickSynth.volume.value = -12; // ปรับระดับเสียงนาฬิกาไม่ให้ดังรบกวนเกินไป

                audioInitialized = true;
            }
            if (Tone.context.state !== 'running') {
                Tone.context.resume();
            }
        }

        function playSound(type) {
            if (!synth) return;
            if (type === 'correct') {
                synth.triggerAttackRelease("C5", "8n");
                setTimeout(() => synth.triggerAttackRelease("E5", "8n"), 150);
            } else if (type === 'wrong') {
                synth.triggerAttackRelease("G3", "8n");
            }
        }

        // Helper for generating choices
        function makeChoices(correctVal, unit, d1, d2, d3) {
            // สร้างตัวเลือก 4 ข้อ (สุ่มสลับตำแหน่ง) พร้อมใส่ลูกน้ำในตัวเลข
            let opts = [
                { text: correctVal.toLocaleString() + " " + unit, isCorrect: true },
                { text: d1.toLocaleString() + " " + unit, isCorrect: false },
                { text: d2.toLocaleString() + " " + unit, isCorrect: false },
                { text: d3.toLocaleString() + " " + unit, isCorrect: false }
            ];
            return opts.sort(() => Math.random() - 0.5);
        }

        // ฟังก์ชันสร้างคำถาม 100 ข้อ ครอบคลุมจุดดักเรื่องหน่วย
        function generateQuestions() {
            let pool = [];
            
            // S1: m(kg), c(J/kg°C) -> Match (5 items)
            const s1_m = [1, 1.5, 2, 3, 5];
            const s1_dt = [10, 20, 30, 40, 50];
            for(let i=0; i<5; i++){
                let m = s1_m[i]; let dt = s1_dt[i]; let c = 4200;
                let ans = m * c * dt;
                pool.push({
                    text: `น้ำมวล <b class="text-blue-600">${m} kg</b> มีอุณหภูมิเพิ่มขึ้น <b class="text-red-500">${dt} °C</b><br><span class="text-sm text-gray-500 mt-2 block">(กำหนด c = 4200 J/kg·°C)</span>`,
                    options: makeChoices(ans, "J", (m/1000)*c*dt, (m*1000)*c*dt, m*dt)
                });
            }

            // S2: m(g), c(J/kg°C) -> Trap! Convert m to kg (5 items)
            const s2_m = [100, 200, 300, 400, 500];
            const s2_dt = [10, 15, 20, 25, 30];
            for(let i=0; i<5; i++){
                let m = s2_m[i]; let dt = s2_dt[i]; let c = 4200;
                let ans = (m / 1000) * c * dt;
                pool.push({
                    text: `น้ำมวล <b class="text-blue-600">${m} g</b> มีอุณหภูมิลดลง <b class="text-red-500">${dt} °C</b><br><span class="text-sm text-gray-500 mt-2 block">(กำหนด c = 4200 J/kg·°C)</span>`,
                    options: makeChoices(ans, "J", m*c*dt, (m*1000)*c*dt, (m/100)*c*dt)
                });
            }

            // S3: m(kg), c(cal/g°C) -> Trap! Convert m to g (5 items)
            const s3_m = [0.1, 0.2, 0.5, 1, 2];
            const s3_dt = [10, 20, 50, 80, 100];
            for(let i=0; i<5; i++){
                let m = s3_m[i]; let dt = s3_dt[i]; let c = 1;
                let ans = (m * 1000) * c * dt;
                pool.push({
                    text: `น้ำมวล <b class="text-blue-600">${m} kg</b> อุณหภูมิเพิ่มขึ้น <b class="text-red-500">${dt} °C</b><br><span class="text-sm text-gray-500 mt-2 block">(กำหนด c = 1 cal/g·°C)</span>`,
                    options: makeChoices(ans, "cal", m*c*dt, (m/1000)*c*dt, m*c)
                });
            }

            // S4: m(g), c(cal/g°C) -> Match (5 items)
            const s4_m = [50, 100, 150, 200, 250];
            const s4_c = [0.5, 0.5, 1, 1, 0.5]; 
            for(let i=0; i<5; i++){
                let m = s4_m[i]; let dt = s3_dt[i]; let c = s4_c[i];
                let ans = m * c * dt;
                pool.push({
                    text: `สสารมวล <b class="text-blue-600">${m} g</b> อุณหภูมิเปลี่ยนไป <b class="text-red-500">${dt} °C</b><br><span class="text-sm text-gray-500 mt-2 block">(กำหนด c = ${c} cal/g·°C)</span>`,
                    options: makeChoices(ans, "cal", (m/1000)*c*dt, (m*1000)*c*dt, m*dt)
                });
            }

            // S5: m(kg), L(kJ/kg) -> Match (5 items)
            const s5_m = [1, 2, 3, 4, 5];
            for(let i=0; i<5; i++){
                let m = s5_m[i]; let L = 2256;
                let ans = m * L;
                pool.push({
                    text: `น้ำเดือดกลายเป็นไอ มวล <b class="text-blue-600">${m} kg</b><br><span class="text-sm text-gray-500 mt-2 block">(กำหนดความร้อนแฝง L = 2256 kJ/kg)</span>`,
                    options: makeChoices(ans, "kJ", (m/1000)*L, (m*1000)*L, m)
                });
            }

            // S6: m(g), L(kJ/kg) -> Trap! (5 items)
            const s6_m = [100, 200, 250, 400, 500];
            for(let i=0; i<5; i++){
                let m = s6_m[i]; let L = 333;
                let ans = (m / 1000) * L;
                pool.push({
                    text: `น้ำแข็งหลอมเหลว มวล <b class="text-blue-600">${m} g</b><br><span class="text-sm text-gray-500 mt-2 block">(กำหนดความร้อนแฝง L = 333 kJ/kg)</span>`,
                    options: makeChoices(ans, "kJ", m*L, (m*1000)*L, (m/100)*L)
                });
            }

            // S7: m(kg), L(cal/g) -> Trap! (5 items)
            const s7_m = [0.1, 0.2, 0.3, 0.5, 1];
            for(let i=0; i<5; i++){
                let m = s7_m[i]; let L = 80;
                let ans = (m * 1000) * L;
                pool.push({
                    text: `น้ำแข็งละลายหมด มวล <b class="text-blue-600">${m} kg</b><br><span class="text-sm text-gray-500 mt-2 block">(กำหนด L = 80 cal/g)</span>`,
                    options: makeChoices(ans, "cal", m*L, (m/1000)*L, m)
                });
            }

            // S8: m(g), L(cal/g) -> Match (5 items)
            const s8_m = [10, 20, 50, 100, 200];
            for(let i=0; i<5; i++){
                let m = s8_m[i]; let L = 540;
                let ans = m * L;
                pool.push({
                    text: `น้ำเดือดกลายเป็นไอ มวล <b class="text-blue-600">${m} g</b><br><span class="text-sm text-gray-500 mt-2 block">(กำหนด L = 540 cal/g)</span>`,
                    options: makeChoices(ans, "cal", (m/1000)*L, (m*1000)*L, m)
                });
            }

            // ขยายจำนวนข้อให้ครบ 100 ข้อจากการสุ่มโจทย์ในคลัง
            const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
            let shuffledPool = shuffle(pool);
            let finalPool = [];
            while(finalPool.length < 100) {
                finalPool = finalPool.concat(shuffledPool);
            }
            return finalPool.slice(0, 100);
        }

        function renderQuestion() {
            if (currentQuestionIndex >= questions.length) {
                endGame();
                return;
            }

            const q = questions[currentQuestionIndex];
            
            // Update UI texts
            document.getElementById('current-question-num').innerText = currentQuestionIndex + 1;
            document.getElementById('question-text').innerHTML = q.text;
            document.getElementById('progress-bar').style.width = `${(currentQuestionIndex / questions.length) * 100}%`;
            
            // Render options
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "choice-card w-full h-full bg-white border-2 border-indigo-100 hover:border-indigo-400 hover:bg-indigo-50 text-indigo-900 font-bold py-6 px-4 rounded-2xl shadow-sm text-lg md:text-xl flex items-center justify-center transition-colors";
                btn.innerText = opt.text;
                btn.onclick = () => checkAnswer(opt.isCorrect, btn);
                choicesContainer.appendChild(btn);
            });

            // Re-trigger animation
            const qContainer = document.getElementById('question-container');
            qContainer.classList.remove('animate-pop');
            void qContainer.offsetWidth; // trigger reflow
            qContainer.classList.add('animate-pop');
        }

        function checkAnswer(isCorrect, btnElement) {
            initAudio();
            
            // Disable all buttons to prevent double click
            const buttons = document.querySelectorAll('.choice-card');
            buttons.forEach(b => {
                b.onclick = null;
                b.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50');
            });

            const x = window.innerWidth / 2;
            const y = window.innerHeight / 2;

            if (isCorrect) {
                playSound('correct');
                score += 2;
                btnElement.classList.remove('bg-white', 'border-indigo-100', 'text-indigo-900');
                btnElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'shadow-lg');
                showFloatingText(x, y, "+2", "text-emerald-500");
            } else {
                playSound('wrong');
                score -= 1;
                btnElement.classList.remove('bg-white', 'border-indigo-100', 'text-indigo-900');
                btnElement.classList.add('bg-rose-500', 'text-white', 'border-rose-600', 'shadow-lg');
                document.getElementById('question-container').classList.add('animate-shake');
                showFloatingText(x, y, "-1", "text-rose-500");
                
                // Highlight correct answer
                const q = questions[currentQuestionIndex];
                buttons.forEach((b, index) => {
                    if(q.options[index].isCorrect) {
                        b.classList.remove('bg-white', 'border-indigo-100', 'text-indigo-900');
                        b.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-800');
                    }
                });
            }
            
            document.getElementById('score-display').innerText = score;

            // ดีเลย์เล็กน้อยให้เห็นสีว่าถูกหรือผิดก่อนเปลี่ยนข้อ
            setTimeout(() => {
                document.getElementById('question-container').classList.remove('animate-shake');
                currentQuestionIndex++;
                renderQuestion();
            }, 600); 
        }

        function showFloatingText(x, y, text, colorClass) {
            const el = document.createElement('div');
            el.className = `fixed font-black text-6xl z-50 pointer-events-none float-up ${colorClass} drop-shadow-xl`;
            el.innerText = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                let s = (timeLeft % 60).toString().padStart(2, '0');
                document.getElementById('time-display').innerText = `${m}:${s}`;
                
                // ระบบเล่นเสียงนาฬิกาเดิน
                if (audioInitialized && timeLeft > 0) {
                    if (timeLeft <= 10) {
                        tickSynth.triggerAttackRelease("C5", "32n"); // เสียงแหลมขึ้นเมื่อเหลือ 10 วิสุดท้าย
                    } else {
                        tickSynth.triggerAttackRelease("C4", "64n"); // เสียงปกติ
                    }
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            document.getElementById('game-screen').classList.add('hidden');
            if (timerInterval) clearInterval(timerInterval);
            
            const endScreen = document.getElementById('end-screen');
            endScreen.classList.remove('hidden');
            endScreen.classList.add('flex');
            
            document.getElementById('final-score').innerText = `${score} คะแนน`;
            
            let endMsg = "";
            if(score >= 60) endMsg = "สุดยอด! ปรมาจารย์ด้านเทอร์โมไดนามิกส์ตัวจริง! ⚡";
            else if(score >= 30) endMsg = "เก่งมาก! เข้าใจเรื่องหน่วยและทำเวลาได้ดี! 👍";
            else if(score >= 10) endMsg = "ทำได้ดี! แต่ต้องระวังเรื่องการแปลงหน่วยและฝึกให้ไวขึ้นนะ 💪";
            else endMsg = "หมดเวลา! ลองกลับไปทบทวนเรื่องหน่วยและมาท้าทายเวลาใหม่นะ! 🔥";
            
            document.getElementById('end-message').innerText = endMsg;
        }

        // Initialize Game
        window.onload = () => {
            initCanvas();
            questions = generateQuestions();
            renderQuestion();
            startTimer();

            // ดักการสัมผัสจอครั้งแรกเพื่อให้เสียง (AudioContext) เริ่มทำงานได้ทันที
            const unlockAudio = () => {
                initAudio();
                document.removeEventListener('pointerdown', unlockAudio);
            };
            document.addEventListener('pointerdown', unlockAudio);
        };
    </script>
</body>
</html>
